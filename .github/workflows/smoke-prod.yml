# Optional: smoke test a deployment. Manual trigger only.
# Set INFERENCIA_SMOKE_BASE_URL (and optionally INFERENCIA_E2E_API_KEY) in repo secrets,
# then run it from the Actions tab. If the secret is unset the job fails loudly
# (scripts/smoke-prod.sh's own guard) instead of passing without testing anything.
# It was previously on a daily cron; that was removed because the secret was never
# configured, so every scheduled run failed without telling anyone anything new.
name: Smoke (production)

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test production
        env:
          INFERENCIA_SMOKE_BASE_URL: ${{ secrets.INFERENCIA_SMOKE_BASE_URL }}
          INFERENCIA_E2E_API_KEY: ${{ secrets.INFERENCIA_E2E_API_KEY }}
        run: |
          chmod +x scripts/smoke-prod.sh
          scripts/smoke-prod.sh
