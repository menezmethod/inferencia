# inferencia — configuration
#
# inferencia is the API gateway in front of local LLM and TTS backends.
# Default chat model fallback (when request.model is omitted): qwen3.6:35b-a3b-coding-bf16.
# Copy this file to config.yaml and adjust as needed.
# Environment variables (INFERENCIA_*) override file values.
#
# TTS backends can be configured either via the `tts_backends` section below
# or via INFERENCIA_KOKORO_URL, INFERENCIA_CHATTERBOX_URL env vars.

server:
  host: "127.0.0.1"
  port: 8080
  read_timeout: 30s
  write_timeout: 120s   # Long timeout for streaming responses.

auth:
  keys_file: "./keys.txt" # One API key per line. Lines starting with # are ignored.

backends:
  - name: "ollama"
    type: "ollama"
    url: "http://localhost:11434"
    health_timeout: 5s    # health probes and GET /v1/models
    timeout: 300s         # chat/embeddings; streaming uses request context (no client timeout)
  # - name: "commandcode"          # hosted provider (DeepSeek, Muse, Kimi, GLM, ...)
  #   type: "commandcode"
  #   # url defaults to https://api.commandcode.ai/provider/v1; override with INFERENCIA_COMMANDCODE_URL
  #   api_key_env: "INFERENCIA_COMMANDCODE_KEY"   # never put the key in YAML
  #   health_timeout: 10s
  #   timeout: 300s

# Decision engines (System One): typed decisions, not chat.
# Laya runs locally (local-first); Jev is TypeSafe's hosted engine.
# Both speak the same /v1/systemone protocol.
decisions:
  - name: "laya"                          # local, free, ~30ms after warm-up
    url: "http://127.0.0.1:8000"
    models: ["english", "multilingual"]
    # api_key_env: "LAYA_API_KEY"         # only when laya-serve sets one
  # - name: "jev"                         # hosted; needs an API key
  #   url: "https://api.typesafe.ai"
  #   api_key_env: "TYPESAFE_API_KEY"
  #   models: ["jev-latest"]

# Task-aware routing: virtual role models advertised in GET /v1/models.
# A harness requests "inferencia-planner" and the router forwards the first
# role model to the role backend. Unknown models fall back to default_role.
routing:
  default_role: "inferencia-worker"
  roles:
    inferencia-planner:
      backend: "commandcode"
      models: ["meta/muse-spark-1.3-contributor"]
    inferencia-worker:
      backend: "commandcode"
      models: ["deepseek/deepseek-v4.1-flash"]
    inferencia-fast:
      backend: "ollama"
      models: ["qwen3.5:0.8b"]
    inferencia-auto:
      backend: "commandcode"
      models: ["deepseek/deepseek-v4.1-flash"]  # static fallback for auto
  # Decision-powered auto: requests for inferencia-auto ask the decision
  # engine which role should handle them, falling back to default_role.
  # Policy variants: "auto:quality", "auto:economy", "auto:free" (bare "auto"
  # is balanced). Built-ins: free never spends paid credits; economy holds a
  # higher confidence bar; quality falls back to the strongest role.
  auto:
    decision: "laya"
    question: "Which model tier should handle this request?"
    min_confidence: 0.0 # >0 forwards an abstention gate; abstaining falls back
    criteria:
      planner: "complex multi-step planning, architecture, or deep reasoning"
      worker: "routine coding, edits, tests, or analysis"
      fast: "trivial lookups, short answers, or formatting"
    # policies:
    #   quality:
    #     fallback: "inferencia-planner"
    #   economy:
    #     min_confidence: 0.7
    #     fallback: "inferencia-fast"
    #   free:
    #     local_only: true # ollama/mlx backends only; implied by auto:free

# TTS backends (optional). Each is an HTTP server exposing OpenAI-compatible
# /v1/audio/speech and /v1/models endpoints.
tts_backends:
  - name: "kokoro"
    url: "http://localhost:50051"
    timeout: 30s
  # - name: "chatterbox"
  #   url: "http://localhost:50052"
  #   timeout: 30s

ratelimit:
  requests_per_second: 10
  burst: 20

log:
  level: "info"       # debug | info | warn | error
  format: "json"      # json | text
  # cloud_format: ""  # "" | gcp | gcp_with_resource — add severity (and resource) for GCP Cloud Logging

# Watchdog: background health-check loop for all backends.
# Pings /health every interval. After fail_threshold consecutive failures
# a backend is marked DEGRADED and skipped for new inference requests.
watchdog:
  interval: 30s
  fail_threshold: 3
  request_timeout: 5s

# Metrics: GET /metrics is always enabled (no auth). Optional tracing below.
observability:
  otel_enabled: false
  otel_endpoint: "http://localhost:4318"   # http = insecure (local); https = TLS (prod)
  otel_service_name: "inferencia"
